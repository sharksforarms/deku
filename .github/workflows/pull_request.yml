on: [pull_request]
name: CI Pull Request
jobs:
  runCallgrindBenchmark:
    name: Benchmark (callgrind)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: gungraun/setup-gungraun@v1.1.3
      - uses: wcampbell0x2a/rust-bench-compare-action@v1.0.0
        with:
          harness: gungraun
          branchName: ${{ github.base_ref }}
          benchName: deku_callgrind
          features: alloc,bits
          token: ${{ secrets.GITHUB_TOKEN }}
