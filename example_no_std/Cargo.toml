[package]
name = "example_no_std"
version = "0.1.0"
authors = ["sharks <sharks@sharks>"]
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace]

[lib]
name = "no_std_lib"
path = "src/lib.rs"

[[bin]]
name = "example_no_std"
path = "src/main.rs"

[features]
default = ["alloc", "deku/alloc", "deku/bits" ]
alloc = ["dep:cortex-m", "dep:embedded-alloc"]

[dependencies]
cortex-m = { version = "0.7.7", optional = true, features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
deku = { path = "../", default-features = false }
embedded-alloc = { version = "0.6.0", optional = true }
