on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

name: CI

permissions:
  contents: read

# Keep only the newest CI run for each pull request or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_environment:
    name: Build shared environment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      msrv: ${{ steps.rust.outputs.msrv }}
      stable: ${{ steps.rust.outputs.stable }}
      beta: ${{ steps.rust.outputs.beta }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Resolve concrete toolchain versions and pass them as build args:
      # changed args invalidate the image layer cache, so the environment is
      # rebuilt when Rust releases. Pinning the channels inside the image would
      # leave a cached image (and its toolchains) stale forever.
      - name: Resolve current Rust releases
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          resolve_channel() {
            curl --fail --silent --show-error \
              "https://static.rust-lang.org/dist/channel-rust-$1.toml" |
              awk '/^\[pkg\.rust\]$/ { found = 1; next }
                   found && /^version = / { gsub(/"/, "", $3); print $3; found = 0 }'
          }
          # extract MSRV from Cargo.toml
          msrv=$(awk -F'"' '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^[[:space:]]*rust-version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          stable=$(resolve_channel stable)
          beta=$(resolve_channel beta)
          test -n "$msrv" && test -n "$stable" && test -n "$beta"
          printf 'msrv=%s\nstable=%s\nbeta=%s\nuid=%s\ngid=%s\n' \
            "$msrv" "$stable" "$beta" "$(id -u)" "$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Populate shared build-environment cache
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            MSRV_TOOLCHAIN=${{ steps.rust.outputs.msrv }}
            STABLE_TOOLCHAIN=${{ steps.rust.outputs.stable }}
            BETA_TOOLCHAIN=${{ steps.rust.outputs.beta }}
            USER_UID=${{ steps.rust.outputs.uid }}
            USER_GID=${{ steps.rust.outputs.gid }}
          # The image is materialized by each matrix job on its own runner;
          # this job only populates the shared BuildKit cache.
          cache-from: type=gha,scope=deku-build-environment
          cache-to: type=gha,mode=max,scope=deku-build-environment,ignore-error=true

  checks:
    name: CI
    needs: build_environment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: msrv
            name: MSRV
            command: ci-msrv
            toolchain: msrv
          - id: stable
            name: stable
            command: ci-stable
            toolchain: stable
          - id: beta
            name: beta
            command: ci-beta
            toolchain: beta
          - id: lint
            name: lint
            command: ci-lint
            toolchain: stable
          - id: coverage
            name: coverage
            command: coverage
            toolchain: stable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve runner identity
        id: runner
        shell: bash
        run: |
          printf 'uid=%s\ngid=%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Load shared build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: deku-build
          build-args: |
            MSRV_TOOLCHAIN=${{ needs.build_environment.outputs.msrv }}
            STABLE_TOOLCHAIN=${{ needs.build_environment.outputs.stable }}
            BETA_TOOLCHAIN=${{ needs.build_environment.outputs.beta }}
            USER_UID=${{ steps.runner.outputs.uid }}
            USER_GID=${{ steps.runner.outputs.gid }}
          # Only the build_environment job exports this scope. Parallel jobs
          # read it and materialize the image locally with load: true.
          cache-from: type=gha,scope=deku-build-environment

      # On a cache miss Docker creates missing bind-mount sources as root,
      # leaving the non-root container user unable to write to the caches.
      # Pre-create them so they are owned by the runner user, matching the
      # UID/GID the container's deku user is built with.
      - name: Create cache directories
        run: mkdir -p .ci-cache/cargo-registry .ci-cache/cargo-git .ci-cache/target

      - name: Restore Cargo build cache
        uses: actions/cache@v5
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
            .ci-cache/target/.rustc_info.json
            .ci-cache/target/debug
            .ci-cache/target/llvm-cov-target
            .ci-cache/target/tests
            .ci-cache/target/thumbv6m-none-eabi
            .ci-cache/target/thumbv7em-none-eabihf
            .ci-cache/target/wasm32-unknown-unknown
          key: deku-cargo-v4-${{ matrix.id }}-${{ runner.os }}-${{ needs.build_environment.outputs.msrv }}-${{ needs.build_environment.outputs.stable }}-${{ needs.build_environment.outputs.beta }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'Dockerfile', 'compose.yaml', 'compose.ci.yaml', 'Justfile', 'rustfmt.toml') }}
          restore-keys: |
            deku-cargo-v4-${{ matrix.id }}-${{ runner.os }}-

      - name: Run ${{ matrix.name }} pipeline
        env:
          DEKU_IMAGE: deku-build
          DEKU_TOOLCHAIN: ${{ matrix.toolchain }}
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm build just ${{ matrix.command }}

      - name: Upload coverage to Codecov
        if: matrix.id == 'coverage'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true
